version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # Repo policy is Conventional Commits; dependabot's default nuget subject ("Bump x
    # from a to b") is not.
    commit-message:
      prefix: "chore(deps)"
    # Keep the Microsoft.Extensions.* family in lockstep: a solo bump (e.g. Hosting
    # 8.x -> 10.x in one project) drags mismatched transitive versions against the
    # 8.0.x pins elsewhere and fails restore with NU1605 package downgrades.
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      # Same reasoning as above, for the test stack. Dependabot scopes nuget updates per
      # project directory, so an ungrouped bump lands in one test project and leaves the
      # other two behind - which is exactly what the coverlet 10 and Test.Sdk 18 PRs did.
      # coverlet >= 8 also documents a minimum Microsoft.NET.Test.Sdk, so the two have to
      # move together or the pair is out of support.
      test-platform:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "xunit*"
    ignore:
      # net8.0 targets stay on the 8.x Microsoft.Extensions train.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # FluentAssertions >= 8 switched to a commercial (Xceed) license.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
