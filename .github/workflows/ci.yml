name: CI

on:
  push:
    branches: [develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskbarFolders.sln

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskbarFolders.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Check formatting
        run: dotnet format TaskbarFolders.sln --verify-no-changes --verbosity diagnostic

      # retention-days on all uploads: the account artifact-storage quota filled up and
      # every upload step failed with "Artifact storage quota has been hit" (the 90-day
      # default kept ~180 MB of bin trees per run alive for three months).
      - name: Upload raw coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Generate coverage HTML + summary
        if: always()
        shell: pwsh
        run: |
          # Tool version pinned in .config/dotnet-tools.json so CI can't silently drift.
          dotnet tool restore
          dotnet reportgenerator `
            -reports:./TestResults/**/coverage.cobertura.xml `
            -targetdir:./TestResults/CoverageReport `
            -reporttypes:"Html;TextSummary"
          Write-Host "----- Coverage summary -----"
          Get-Content ./TestResults/CoverageReport/Summary.txt

      # A floor, deliberately below the current figure, so coverage can only be
      # ratcheted up. Until v0.4.10 this measured nothing at all: Release builds set
      # DebugType=none, coverlet had no debug information to instrument against, and every
      # report above was empty while still being uploaded and summarised.
      - name: Enforce coverage floor
        shell: pwsh
        env:
          MINIMUM_LINE_COVERAGE: '65'
        run: |
          $summary = './TestResults/CoverageReport/Summary.txt'
          if (-not (Test-Path $summary)) {
            throw "No coverage summary at $summary - the collection step did not produce a report."
          }

          $line = Select-String -Path $summary -Pattern 'Line coverage:\s*([0-9.]+)%' | Select-Object -First 1
          if (-not $line) {
            throw "Could not read a line-coverage figure from $summary."
          }

          $actual = [double]$line.Matches[0].Groups[1].Value
          $floor = [double]$env:MINIMUM_LINE_COVERAGE
          "Line coverage $actual % (floor $floor %)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($actual -eq 0) {
            throw "Line coverage is 0 % - coverage collection is broken, not the tests."
          }
          if ($actual -lt $floor) {
            throw "Line coverage $actual % is below the required $floor %."
          }

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          retention-days: 7

      # The two Release bin trees are the quota hog; dependabot PRs never need them.
      - name: Upload build artifacts
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/TaskbarFolders.Manager/bin/Release/
            src/TaskbarFolders.Launcher/bin/Release/
          retention-days: 3
